function eff(){const d=ov?new Date(ov+'T12:00'):new Date();d.setHours(12);while(d.getDay()%6==0)d.setDate(d.getDate()+1);return d}
const L3=(t,i)=>t?t.L[di].map(f3):P.map(()=>'');
function cells(a,cls){return a.map(v=>`<td class="${cls||''}">${e(v)}</td>`).join('')}
function fit(el){el.style.fontSize='';let f=parseFloat(getComputedStyle(el).fontSize)||12;while(el.scrollWidth>el.clientWidth+1&&f>5){f-=.5;el.style.fontSize=f+'px'}}
const fitAll=()=>document.querySelectorAll('.fit').forEach(fit);addEventListener('resize',fitAll);addEventListener('load',fitAll);
function render(){const d=eff();di=d.getDay()-1;iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');$('tar').value=iso;
$('dat').textContent=`${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()} ${GUN[d.getDay()]}`;
const r=R[iso]||Array(7).fill(''),loc=['BAHÇE-1','BAHÇE-2','KANTİN','ZEMİN KAT','1. KAT','2. KAT','MÜDÜR YARDIMCISI'];
$('ro').innerHTML=`<table class="ro"><tr>${loc.map(x=>`<th>${x}</th>`).join('')}</tr><tr>${r.map(x=>`<td><div class="fit">${e(norm(x))}</div></td>`).join('')}</tr></table>`;
const hd=`<tr><th></th>${P.map(p=>`<th>${p}.D</th>`).join('')}</tr>`;
$('nb').innerHTML=`<table>${hd}${r.slice(0,6).map((n,i)=>`<tr><td rowspan="2" class="pk"><div class="fit">${e(norm(n))}</div></td>${cells(L3(findT(n)))}</tr><tr>${P.map(p=>`<td><div class="fit" contenteditable="true" data-k="${iso}|${i}|${p}">${e(M[iso+'|'+i+'|'+p]||'')}</div></td>`).join('')}</tr>`).join('')}</table>`;
$('bd').innerHTML=`<table>${hd}${B.map((n,i)=>`<tr><td class="nm"><input class="fit" list="tl" data-b="${i}" value="${e(n)}"></td>${cells(L3(findT(n)))}</tr>`).join('')}</table>`;
const dh=`<tr>${P.map(p=>`<th>${p}. DERS</th>`).join('')}</tr>`;
$('og').innerHTML=`<div class="sr"><label>Öğretmenin adı soyadı</label><input class="fit" list="tl" data-o value="${e(OG)}" placeholder="Yazın veya listeden seçin"></div><table>${dh}<tr>${cells(L3(findT(OG)))}</tr></table>`;
const c=findC(SN);$('sn').innerHTML=`<div class="sr"><label>Sınıf adı</label><input class="fit" list="cl" data-s value="${e(SN)}" placeholder="Örn. 6/C"></div><table>${dh}<tr>${(c?c.L[di].map(full):P.map(()=>'')).map(v=>`<td style="font-size:.8em">${e(v)}</td>`).join('')}</tr></table>`;
$('tl').innerHTML=T.map(t=>`<option value="${e(t.n)}">`).join('')+'<option value="MUAMMER BOZER">';$('cl').innerHTML=C.map(c=>`<option value="${e(c.n)}">`).join('');lastK='';tick();rn();fitAll()}
const sec=h=>{const[a,b]=h.split(':');return a*3600+b*60};
const fmt=r=>`${r>=3600?Math.floor(r/3600)+' sa ':''}${Math.floor(r%3600/60)} dk ${r%60} sn`;
function tick(){const n=new Date(),s=n.getHours()*3600+n.getMinutes()*60+n.getSeconds();$('clk').textContent=n.toLocaleTimeString('tr-TR');
let k=-1,title='DERS DIŞI ZAMAN',line='',rem=0,pr=0;
if(n.getDay()%6){if(s<sec(ZIL[0][0])){k=0;title='DERS ÖNCESİ';line='Derse';rem=sec(ZIL[0][0])-s}else for(let i=0;i<8;i++){const a=sec(ZIL[i][0]),b=sec(ZIL[i][1]);if(s<a){k=i;title='TENEFFÜS';line='Derse';rem=a-s;break}if(s<b){k=i;title=`${i+1}. DERS`;line='Bitime';rem=b-s;pr=(s-sec(ZIL[i][0]))/(b-a);break}}}
$('dn').textContent=title;$('dr').textContent=k<0?'':`${line} ${fmt(rem)}`;const inL=line=='Bitime';
$('bs').textContent=inL?ZIL[k][0]:'—';$('be').textContent=k<0?'—':ZIL[k][1];$('pg').style.width=(pr*100)+'%';
const kk=k<0?7:k,key2=kk+title;if(key2!=lastK){lastK=key2;$('rt').textContent=title;$('rc').innerHTML=C.map(c=>`<tr><td>${e(c.n)} SINIFI</td><td>${e(full(c.L[di][kk]))}</td></tr>`).join('');if(typeof fitAll=='function')fitAll()}}
const sv=()=>LS.s('fh_n',N);
function rn(){$('nt').innerHTML=N.map((t,i)=>i==ed?`<div class="ed"><textarea rows="3" ${ro?'readonly':''}>${e(t)}</textarea><div><button data-a="k">Kaydet</button><button data-a="d">Düzenle</button><button data-a="s">Sil</button></div></div>`:`<div class="nc" data-i="${i}">${e(t)}</div>`).join('');const ta=$('nt').querySelector('textarea');if(ta&&!ro)ta.focus()}
function commit(){const ta=$('nt').querySelector('textarea');if(ed>=0&&ta&&!ta.readOnly)N[ed]=ta.value.trim();sv()}
$('nt').onclick=x=>{const a=x.target.dataset.a,c=x.target.closest('.nc');
if(a=='d'){const ta=$('nt').querySelector('textarea');ro=false;ta.readOnly=false;ta.focus();return}
if(a=='k'){commit();if(N[ed]===''&&N.length>1)N.splice(ed,1);ed=-1}
else if(a=='s'){N.splice(ed,1);if(!N.length)N=[''];ed=-1}
else if(c){commit();ed=+c.dataset.i;ro=N[ed]!==''}else return;sv();rn()};
$('yeni').onclick=()=>{commit();let i=N.indexOf('');if(i<0){N.push('');i=N.length-1}ed=i;ro=false;rn()};
document.addEventListener('input',x=>{const t=x.target;
if(t.dataset.k){M[t.dataset.k]=t.textContent;LS.s('fh_m',M)}
else if('b' in t.dataset){B[t.dataset.b]=t.value;LS.s('fh_b',B);fill(t,findT(t.value),cells)}
else if('o' in t.dataset){OG=t.value;LS.s('fh_t',OG);fill(t,findT(OG))}
else if('s' in t.dataset){SN=t.value;LS.s('fh_c',SN);const c=findC(SN);fill(t,c&&c.L[di].map(full))}
if(t.classList.contains('fit'))fit(t)});
function fill(inp,t){const tr=inp.closest('tr')||inp.closest('.card').querySelector('table tr:last-child'),tds=inp.closest('tr')?[...tr.children].slice(1):[...tr.children],a=Array.isArray(t)?t:L3(t);tds.forEach((td,i)=>td.textContent=a[i]||'')}
$('tar').onchange=x=>{ov=x.target.value;render()};
$('xl').onchange=x=>{const f=x.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'}),g=k=>{const n=wb.SheetNames.find(s=>norm(s).startsWith(k));return n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}):null},d={o:g('ÖĞRET'),s:g('SINIF'),n:g('NÖBET')};if(!d.o||!d.s||!d.n)throw 0;D=d;LS.s('fh_d',d);parse();render();alert('Excel bilgileri güncellendi.')}catch(z){alert('Excel okunamadı. "Öğretmenler", "Sınıflar" ve "nöbet" sayfaları gerekli.')}};r.readAsArrayBuffer(f);x.target.value=''};
parse();render();setInterval(tick,1000);
</script></body></html>
